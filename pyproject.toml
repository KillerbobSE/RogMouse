[project]
name = "rogmouse"
version = "0.1.0"
description = "Battery tray indicator for the ASUS ROG Keris II Origin on Linux"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PySide6-Essentials>=6.6"]

[project.gui-scripts]
rogmouse = "rogmouse.tray:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
